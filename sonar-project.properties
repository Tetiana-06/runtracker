# --- Ідентифікація проєкту -----------------------------------------------
# Для SonarCloud: скопіюйте значення зі сторінки проєкту (Information).
sonar.projectKey=Tetiana-06
sonar.organization=tetiana-06
sonar.projectName=RunTracker
sonar.projectVersion=1.0

# --- Що аналізуємо --------------------------------------------------------
sonar.sources=backend/app,frontend/js,frontend/css
sonar.tests=backend/tests
sonar.sourceEncoding=UTF-8

# --- Python ---------------------------------------------------------------
sonar.python.version=3.11,3.12
sonar.python.coverage.reportPaths=backend/coverage.xml

# --- Виключення -----------------------------------------------------------
sonar.exclusions=**/node_modules/**,**/__pycache__/**,**/*.db,**/htmlcov/**,docs/**
sonar.coverage.exclusions=backend/seed.py,backend/app/main.py,backend/app/routers/**
